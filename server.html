<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js API Fetching</title>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div id="app" class="max-w-xl mx-auto">
        <h1 class="text-3xl font-bold text-slate-800 text-center mb-2">Users Directory</h1>
        <p class="text-sm text-slate-500 text-center mb-8">Fetching data dynamically from a remote API</p>

        <!-- Loading State -->
        <div v-if="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-slate-500 mt-2 font-medium">Loading users from server...</p>
        </div>

        <!-- Error State -->
        <div v-if="error" class="bg-red-50 border border-red-200 text-red-600 p-4 rounded-xl text-center mb-4">
            {{ error }}
        </div>

        <!-- Users List -->
        <div v-if="!loading && !error" class="space-y-4">
            <div 
                v-for="user in users" 
                :key="user.id" 
                class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:shadow-md transition"
            >
                <div>
                    <h2 class="font-bold text-slate-800 text-lg">{{ user.name }}</h2>
                    <p class="text-sm text-blue-600">@{{ user.username }} — {{ user.email }}</p>
                    <p class="text-xs text-slate-400 mt-1">📍 City: {{ user.address.city }} | 🏢 Company: {{ user.company.name }}</p>
                </div>
                <button 
                    @click="viewDetails(user)"
                    class="px-4 py-2 bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 text-sm font-semibold rounded-xl transition"
                >
                    Details
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            setup() {
                const users = ref([])
                const loading = ref(true)
                const error = ref(null)

                // Fetch users data when the component is mounted (loaded)
                const fetchUsers = async () => {
                    try {
                        const response = await fetch('https://jsonplaceholder.typicode.com/users')
                        
                        if (!response.ok) {
                            throw new Error('Failed to fetch data from the server.')
                        }
                        
                        users.value = await response.json()
                    } catch (err) {
                        error.value = err.message
                    } finally {
                        loading.value = false
                    }
                }

                // onMounted lifecycle hook: runs automatically when the app loads
                onMounted(() => {
                    fetchUsers()
                })

                const viewDetails = (user) => {
                    alert(`User: ${user.name}\nPhone: ${user.phone}\nWebsite: ${user.website}`)
                }

                return {
                    users,
                    loading,
                    error,
                    viewDetails
                }
            }
        }).mount('#app')
    </script>

</body>
</html>
